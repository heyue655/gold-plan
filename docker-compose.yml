services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      PORT: "5000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      SSO_CENTER_URL: ${SSO_CENTER_URL:-https://box.pinyanzhi.net}
      SSO_APP_KEY: ${SSO_APP_KEY:-credit-card}
      SSO_APP_SECRET: ${SSO_APP_SECRET}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
    # No ports exposed to host — only reachable by the client container via internal network

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server
