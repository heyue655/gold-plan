services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      PORT: "5000"
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    # No ports exposed to host — only reachable by the client container via internal network

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server
